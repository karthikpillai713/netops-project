services:
  app:
    build: .
    image: netops-api:v1
    container_name: netops-app
    networks:
      - netops-internal
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:latest
    container_name: netops-blackbox
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    networks:
      - netops-internal
    restart: unless-stopped
    
  prometheus:
    image: prom/prometheus:latest
    container_name: netops-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - netops-internal
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: netops-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - netops-internal
    restart: unless-stopped  

  nginx:
    image: nginx:alpine
    container_name: netops-nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - netops-internal
    restart: unless-stopped

networks:
  netops-internal:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: